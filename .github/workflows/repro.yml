name: repro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: momentum_factor
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MOMENTUM_DB_HOST: 127.0.0.1
      MOMENTUM_DB_PORT: 3306
      MOMENTUM_DB_NAME: momentum_factor
      MOMENTUM_DB_USER: root
      MOMENTUM_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      # renv::restore() compiles from source when no binary is available.
      # igraph needs libglpk, fs needs cmake, knitr needs pandoc; without
      # these the restore step fails and the whole job goes red before any
      # test runs. Install them up front rather than letting the failure
      # surface as an obscure dyn.load error.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libglpk-dev \
            libmariadb-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            pandoc

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      # LOAD DATA LOCAL INFILE needs local_infile enabled on BOTH the server
      # (this step) and the client (--local-infile=1 below).
      - name: Enable local_infile on MySQL server
        run: |
          mysql -h127.0.0.1 -uroot -proot \
            -e "SET GLOBAL local_infile=1; SELECT @@local_infile;"

      - name: Generate synthetic CI fixtures
        run: Rscript R/tests/fixtures/make_fixtures.R

      - name: Run SQL pipeline (schema -> load -> signal -> portfolios -> turnover)
        run: |
          mysql -h127.0.0.1 -uroot -proot momentum_factor < sql/01_schema.sql
          mysql -h127.0.0.1 -uroot -proot --local-infile=1 momentum_factor < sql/02_load_wrds.sql
          mysql -h127.0.0.1 -uroot -proot momentum_factor < sql/03_signal.sql
          mysql -h127.0.0.1 -uroot -proot momentum_factor < sql/04_portfolios.sql
          mysql -h127.0.0.1 -uroot -proot momentum_factor < sql/05_turnover.sql

      - name: Run testthat suite
        run: Rscript -e 'testthat::test_dir("R/tests")'

      - name: Run targets pipeline
        run: Rscript -e 'targets::tar_make()'
