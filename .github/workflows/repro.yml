name: repro

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: momentum_factor
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MOMENTUM_DB_HOST: 127.0.0.1
      MOMENTUM_DB_PORT: 3306
      MOMENTUM_DB_NAME: momentum_factor
      MOMENTUM_DB_USER: root
      MOMENTUM_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      - name: Load SQL schema and fixtures (sample data)
        run: |
          mysql -h127.0.0.1 -uroot -proot momentum_factor < sql/01_schema.sql
        # NOTE: 02_load_wrds.sql requires local WRDS export CSVs which are gitignored
        # (data/ not committed). CI uses a lightweight fixture loader for schema-only
        # smoke tests; full pipeline run requires local WRDS CSVs — see README.

      - name: Run testthat suite
        run: Rscript -e 'testthat::test_dir("R/tests")'

      - name: Run targets pipeline (if data available)
        run: |
          if [ -f data/crsp_monthly.csv ]; then
            Rscript -e 'targets::tar_make()'
          else
            echo "No WRDS data present in CI — skipping full pipeline run (see README)."
          fi
